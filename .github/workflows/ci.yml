name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Format lint
        run: swift format lint --recursive --strict Sources Tests Package.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel
